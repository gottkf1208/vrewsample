<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글자 사이로 통과</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0e15}</style>
</head>
<body>
<!-- 쿼카 모션랩 · 글자 사이로 통과 (Fly Through Letters) -->
<!-- 글꼴: G마켓 산스 (OFL) · 프리텐다드 (OFL) · 눈누(noonnu.cc)의 무료 한글 글꼴 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Noto+Sans+KR:wght@100..900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
@font-face{font-family:'GmarketSans';font-style:normal;font-weight:300;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff) format('woff')}@font-face{font-family:'GmarketSans';font-style:normal;font-weight:500;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff) format('woff')}@font-face{font-family:'GmarketSans';font-style:normal;font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff) format('woff')}
</style>
<div id="qm-brc-fly-through" style="width:100%;max-width:calc(100vh * 1.7778)"></div>
<script>
(function () {
  // ① 설정: 여기만 고치면 됩니다
  const CONFIG = {
    speed: 1,          // 속도 (1 = 기본, 2 = 두 배)
    bg: '#0b0e15',     // 배경색 ('transparent'로 바꾸면 투명)
    colors: ['#ffffff', '#e2e7ef', '#b6bfcf', '#7a869c', '#3b465c', '#14A1C8', '#1f3460', '#0b0e15'],   // 색 8개: 밝은 색 → 진한 색 ([5] 포인트 색, [7] 글자색)
    ratio: '16 / 9'    // 화면 비율 (가로 / 세로)
  };

  // ② 모션: 글자 사이로 통과
  function br2Kit(api) {
    const W = api.W, H = api.H, u = api.u;
    const clamp = x => Math.max(0, Math.min(1, x));
    const rgb = c => /^#[0-9a-f]{6}$/i.test(c) ? [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)) : [128, 128, 128];
    const light = c => { const v = rgb(c); return (v[0] * 299 + v[1] * 587 + v[2] * 114) / 1000; };   // 색의 밝기 0~255
    const ground = api.clear ? 255 - light(api.fg) : light(api.bg);   // 바탕의 밝기 (투명 배경이면 글자색의 반대쪽으로 봄)
    const NS = 'http://www.w3.org/2000/svg';
    const k = {
      W: W, H: H, u: u,
      side: W / H > 1.15,                              // 가로 화면
      tall: H / W > 1.3,                               // 세로로 긴 화면
      pad: Math.round(u * 0.08),                       // 화면 가장자리 여백
      hair: Math.max(1, Math.round(u / 420)),          // 가는 줄 굵기
      dark: ground < 128,                              // 바탕이 어두운지
      clamp: clamp,
      seg: (t, a, b) => clamp((t - a) / (b - a)),      // t가 a~b 사이 어디쯤인지 0~1로
      mix: (a, b, p) => a + (b - a) * p,
      out: x => 1 - Math.pow(1 - clamp(x), 4),         // 빠르게 출발해 부드럽게 멈춤
      expo: x => { x = clamp(x); return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); },   // 더 급하게 출발해 길게 멈춤
      io: x => { x = clamp(x); return x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2; },   // 천천히-빠르게-천천히
      sine: x => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x)),                              // 아주 부드럽게 켜짐
      tint: (c, a) => 'rgba(' + rgb(c).join(',') + ',' + (+a).toFixed(3) + ')',          // 색을 반투명하게
      blend: (a, b, p) => { const x = rgb(a), y = rgb(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * clamp(p)).toString(16).padStart(2, '0')).join(''); },   // 두 색을 섞음
      shade: a => (ground < 128 ? 'rgba(0,0,0,' : 'rgba(255,255,255,') + a + ')',       // 바탕 쪽 그림자 색
      face: fam => '"' + fam + '","Pretendard Variable","Pretendard",sans-serif',      // 글꼴 이름 (없는 글자는 프리텐다드로)
      font: (fam, weight, px) => weight + ' ' + (+px).toFixed(2) + 'px ' + k.face(fam),  // 캔버스용 글꼴 값
      el(parent, css, text, tag) {
        const e = document.createElement(tag || 'div');
        e.style.cssText = css || '';
        if (text !== undefined) e.textContent = text;
        parent.appendChild(e);
        return e;
      },
      // 무대 전체를 덮는 판. 투명 배경이면 판 전체에 옅은 그림자를 둠 (영상 위에 얹어도 읽히게)
      layer: () => (k.top = k.el(api.root, `position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;color:${api.fg};font-family:${k.face('Pretendard Variable')};-webkit-font-smoothing:antialiased;` +
        (api.clear ? `filter:drop-shadow(0 1px 1.5px ${k.shade(0.5)}) drop-shadow(0 ${(u * 0.008).toFixed(1)}px ${(u * 0.03).toFixed(1)}px ${k.shade(0.3)});` : ''))),
      // 빛·빛망울을 둘 판: 투명 배경일 때도 그림자를 두지 않음 (빛에 그림자가 지면 탁해 보임). front면 글자 판 앞에, 아니면 뒤에
      glow(front) {
        const e = document.createElement('div');
        e.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;pointer-events:none;';
        api.root.insertBefore(e, front ? null : k.top || null);
        return e;
      },
      // 어두운 무대: 가운데가 아주 옅게 밝고 가장자리가 가라앉는 바탕 (투명 배경이면 그리지 않음). 늘 맨 아래에 깔림
      stage() {
        if (api.clear) return null;
        const glow = k.dark ? k.blend(api.colors[4], api.deep, 0.5) : api.colors[1], e = document.createElement('div');
        e.style.cssText = `position:absolute;left:0;top:0;width:100%;height:100%;background:` +
          `radial-gradient(${W > H ? '62% 78%' : '95% 52%'} at 50% 47%,${k.tint(glow, k.dark ? 0.42 : 0.6)},${k.tint(glow, 0)} 72%),` +
          `radial-gradient(130% 120% at 50% 50%,rgba(0,0,0,0) 52%,${k.dark ? 'rgba(0,0,0,.5)' : k.tint(api.colors[2], 0.45)} 100%);`;
        api.root.insertBefore(e, api.root.firstChild);
        return e;
      },
      svg(parent, css, vb) {
        const e = document.createElementNS(NS, 'svg');
        if (vb) e.setAttribute('viewBox', vb);
        e.style.cssText = 'position:absolute;left:0;top:0;overflow:visible;' + (css || '');
        parent.appendChild(e);
        return e;
      },
      // 무대를 가득 채우는 캔버스 (그리는 좌표는 CSS 픽셀)
      canvas(parent) {
        const dpr = Math.min(2, window.devicePixelRatio || 1), cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(W * dpr));
        cv.height = Math.max(1, Math.round(H * dpr));
        cv.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;display:block;';
        (parent || api.root).appendChild(cv);
        const c = cv.getContext('2d');
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
        return c;
      },
      // 캔버스로만 쓰는 글꼴도 불러오도록 보이지 않는 글자를 하나 둠
      need(parent, fam, weight, text) {
        k.el(parent, `position:absolute;left:0;top:0;opacity:0;pointer-events:none;white-space:pre;font:${weight} 20px/1 ${k.face(fam)};`, text);
      },
      // 글자의 실제 높이: 글줄 맨 위에서 글자 아랫면까지 (line: 줄 높이 배수)
      foot(fam, weight, px, text, line) {
        const c = document.createElement('canvas').getContext('2d');
        c.font = k.font(fam, weight, px);
        c.textBaseline = 'alphabetic';
        const m = c.measureText(text || '가');
        const fa = m.fontBoundingBoxAscent || px * 0.88, fd = m.fontBoundingBoxDescent || px * 0.24, ad = m.actualBoundingBoxDescent || px * 0.1;
        return (px * line - (fa + fd)) / 2 + fa + ad;
      },
      // 글줄의 폭이 room을 넘지 않게 글자 크기를 정함 (px에서 시작해 넘치면 줄임)
      fit(el, room, px, tall) {
        el.style.fontSize = px + 'px';
        const w = Math.max(el.scrollWidth, el.offsetWidth), h = el.offsetHeight;
        const f = Math.min(1, room / (w || room), tall ? tall / (h || tall) : 1);
        if (f < 1) { px = Math.floor(px * f * 20) / 20; el.style.fontSize = px + 'px'; }
        return px;
      },
      // 글자를 한 자씩 span으로 (빈칸도 자리를 지킴)
      chars(parent, text) {
        return Array.from(String(text)).map(ch => k.el(parent, 'display:inline-block;white-space:pre;will-change:transform;', ch, 'span'));
      },
      // 이름(큰 글자) + 아래 작은 글자. o: { fam, weight, px, room, track, split, color, subk }. 돌려준 값의 put(x, y, align)으로 자리를 정함
      words(parent, title, sub, o) {
        const color = o.color || api.fg;
        const name = k.el(parent, `position:absolute;left:0;top:0;white-space:pre;font:${o.weight || 700} ${o.px}px/1.18 ${k.face(o.fam || 'Pretendard Variable')};letter-spacing:${o.track == null ? -0.03 : o.track}em;color:${color};`);
        const parts = o.split ? k.chars(name, title) : null;
        if (!o.split) name.textContent = title;
        const px = k.fit(name, o.room, o.px);
        let s = null, sp = 0;
        if (sub) {
          sp = Math.max(7.5, px * (o.subk || 0.24));
          s = k.el(parent, `position:absolute;left:0;top:0;white-space:pre;font:600 ${sp}px/1.2 ${k.face('Pretendard Variable')};letter-spacing:.42em;color:${k.tint(color, 0.6)};`, sub);
          sp = k.fit(s, o.room, sp);
        }
        const r = { name: name, sub: s, parts: parts, px: px, sp: sp, nw: name.offsetWidth, nh: name.offsetHeight, sw: s ? s.offsetWidth - sp * 0.42 : 0, sh: s ? s.offsetHeight : 0, gap: s ? px * 0.2 : 0 };
        r.w = Math.max(r.nw, r.sw);
        r.h = r.nh + r.gap + r.sh;
        r.put = (x, y, align) => {
          const c = align === 'center';
          r.nx = c ? x + (r.w - r.nw) / 2 : x;
          r.ny = y;
          r.sx = c ? x + (r.w - r.sw) / 2 : x + px * 0.03;
          r.sy = y + r.nh + r.gap;
          name.style.left = r.nx + 'px';
          name.style.top = r.ny + 'px';
          if (s) { s.style.left = r.sx + 'px'; s.style.top = r.sy + 'px'; s.dataset.mid = c ? '1' : ''; }
        };
        return r;
      },
      // 캔버스로 그린 이름 아래에 둘 작은 글자 한 줄
      tag(parent, text, px) {
        if (!text) return null;
        const sp = Math.max(7.5, px * 0.21);
        const e = k.el(parent, `position:absolute;left:0;top:0;white-space:pre;font:600 ${sp}px/1.2 ${k.face('Pretendard Variable')};letter-spacing:.42em;color:${k.tint(api.fg, 0.6)};`, text);
        k.fit(e, W - k.pad * 2, sp);
        e.dataset.mid = '1';
        return e;
      },
      place(e, cx, y) {
        if (!e) return;
        const sp = parseFloat(e.style.fontSize) || 10;
        e.style.left = cx - (e.offsetWidth - sp * 0.42) / 2 + 'px';
        e.style.top = y + 'px';
      },
      // 작은 글자가 넓은 자간에서 제자리로 좁혀지며 나타남 (p: 0→1)
      track(el, p, from) {
        if (!el) return;
        const ls = k.mix(from == null ? 0.9 : from, 0.42, k.out(p)), px = parseFloat(el.style.fontSize) || 10;
        el.style.opacity = k.clamp(p * 1.4).toFixed(3);
        el.style.letterSpacing = ls.toFixed(3) + 'em';
        if (el.dataset.mid) el.style.transform = `translate3d(${(-(ls - 0.42) * px * (Array.from(el.textContent).length - 1) / 2).toFixed(2)}px,0,0)`;
      }
    };
    k.lite = api.fg;                                                  // 빛 색 (어두운 바탕이면 흰색)
    k.silver = k.blend(api.fg, api.colors[3], 0.3);                   // 은빛 (빛 색보다 조금 차가움)
    k.pop = Math.abs(light(api.accent) - ground) > 28 ? api.accent : api.fg;   // 바탕에 묻히지 않는 포인트 색
    return k;
  }
  function br2Fly(api) {
    const TITLE = 'COMING SOON';   // 이름 (큰 글자)
    const SUB = '모션 따라 하기 · 춤 따라 하기';       // 이름 아래 작은 글자
    const LOOP = 9;              // 한 바퀴 길이(초)
    const k = br2Kit(api), root = k.layer(), W = k.W, H = k.H, u = k.u, side = k.side, fg = api.fg;
    k.stage(root);
    const c = k.canvas(root);
    const tun = k.el(root, 'position:absolute;left:0;top:0;width:100%;height:100%;');
    const fin = k.el(root, `position:absolute;left:0;top:0;width:${W}px;height:${H}px;transform-origin:50% 50%;`);
    const fam = 'GmarketSans', wt = 700;
    const T = k.words(fin, TITLE, SUB, { fam: fam, weight: wt, px: u * (side ? 0.17 : 0.14), room: W - k.pad * 3, track: -0.03, subk: 0.22 });
    T.put((W - T.w) / 2, (H - T.h) / 2, 'center');
    const chars = Array.from(String(TITLE)).filter(ch => ch.trim()).slice(0, 12);
    if (!chars.length) chars.push('Q');
    const G = u * 0.4, zEnd = 4.4, rx = W / u * 0.36 + 0.14, ry = H / u * 0.34 + 0.1, letters = [];
    for (let j = 0; j < 3; j++) chars.forEach((ch, i) => {
      const el = k.el(tun, `position:absolute;left:0;top:0;white-space:pre;font:${wt} ${G.toFixed(1)}px/1 ${k.face(fam)};color:${k.silver};will-change:transform;`, ch);
      letters.push({ el: el, w: el.offsetWidth, h: el.offsetHeight, z: 1 + j, th: i / chars.length * Math.PI * 2 + j * 0.55 - Math.PI / 2 });
    });
    // 빛줄 (터널 벽을 따라 흐름)
    const rnd = api.rand(91), lines = [];
    for (let i = 0; i < 70; i++) lines.push({ a: rnd() * 6.283, r: 0.75 + rnd() * 0.9, z: rnd() * 5.5 });
    const zAt = t => k.mix(-0.7, zEnd - 1, k.io(k.seg(t, 0.1, 3.0)));
    const frame = t => {
      t %= LOOP;
      const p = k.io(k.seg(t, 0.1, 3.0)), zc = zAt(t), vel = (zc - zAt(Math.max(0, t - 0.05))) / 0.05, roll = (1 - p) * 0.8;
      c.clearRect(0, 0, W, H);
      const sv = k.clamp(vel / 2.5);
      if (sv > 0.01) {
        c.lineWidth = Math.max(1, k.hair);
        lines.forEach(o => {
          const d = o.z - zc, d2 = d + 0.35 * sv;
          if (d < 0.12) return;
          const X = Math.cos(o.a + roll) * rx * o.r, Y = Math.sin(o.a + roll) * ry * o.r;
          const s1 = 1 / d, s2 = 1 / d2;
          c.strokeStyle = k.tint(k.silver, 0.32 * sv * k.clamp((5 - d) / 2));
          c.beginPath(); c.moveTo(W / 2 + X * u * s1, H / 2 + Y * u * s1); c.lineTo(W / 2 + X * u * s2, H / 2 + Y * u * s2); c.stroke();
        });
      }
      letters.forEach(o => {
        const d = o.z - zc;
        if (d < 0.18) { o.el.style.opacity = 0; return; }
        const s = 1 / d, a = o.th + roll, x = W / 2 + Math.cos(a) * rx * u * s, y = H / 2 + Math.sin(a) * ry * u * s;
        const al = k.clamp((d - 0.18) / 0.45) * k.clamp((4.2 - d) / 1.6);
        o.el.style.opacity = (al * 0.85).toFixed(3);
        o.el.style.transform = `translate3d(${(x - o.w / 2).toFixed(2)}px,${(y - o.h / 2).toFixed(2)}px,0) scale(${s.toFixed(4)}) rotate(${(roll * 25).toFixed(2)}deg)`;
        o.el.style.filter = d < 0.9 ? `blur(${((0.9 - d) * u * 0.015).toFixed(2)}px)` : 'none';
      });
      const dT = zEnd - zc;
      fin.style.transform = `scale(${(1 / dT * (1 + 0.035 * k.sine(k.seg(t, 3.0, LOOP)))).toFixed(4)})`;   // 도착한 뒤에도 아주 천천히 다가감
      fin.style.opacity = k.clamp((5.8 - dT) / 2.4).toFixed(3);
      k.track(T.sub, k.seg(t, 2.8, 3.6));
    };
    frame.fonts = true;
    frame.loop = LOOP;
    return frame;
  }

  // ③ 공통 엔진: 고칠 필요 없습니다
  function qmEngine(root, CFG, motion) {
    // 색 8개: 가장 밝은 색 → 가장 진한 색. [0] 흰 판·밝은 글자, [1]~[4] 연한 색에서 중간 색, [5] 포인트 색, [6] 둘째 포인트 색, [7] 글자색
    // 바꾸려면 CONFIG에 colors: ['#...', ...] 를 같은 순서로 넣으면 됩니다. 비워 두면 흰색·네이비 계열이 쓰입니다
    const COLORS = CFG.colors || ['#ffffff', '#e8ecf3', '#cfd7e6', '#9aa8c4', '#5c7099', '#1f3460', '#6e1a2f', '#15171c'];
    // 매번 같은 순서가 나오는 난수 (같은 seed면 같은 결과)
    const rand = seed => () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
    // 샘플 그림: CONFIG.images가 비어 있을 때 쓰입니다. 어느 카드에 어떤 그림이 갈지는 열 때마다 섞입니다
    const dice = rand(CFG.seed || Math.floor(Math.random() * 1e9) + 1);
    const shift = Math.floor(dice() * 16);
    // 내 이미지: 칸마다 하나씩(빈 칸은 null → 그 칸은 샘플 그림). 칸보다 장면의 그림 자리가 많으면 돌아가며 씀
    const IMGS = (CFG.images || []).slice();
    const NIMG = IMGS.some(Boolean) ? IMGS.length : 0;
    const used = new Set(), usedArt = new Set();     // 장면이 몇 번째 그림까지 쓰는지 (사이트가 사진 칸 수를 정할 때 읽음)
    const FONT = '"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif';
    // 색의 밝기 (0 = 검정, 255 = 흰색). #rrggbb 꼴이 아니면 검정으로 봅니다
    // 투명 배경 위에 다른 배경을 깔 때(CONFIG.under = 그 배경의 대표 색)는 그 색을 바탕으로 보고 글자색을 고릅니다
    const light = color => color === 'transparent' && /^#[0-9a-f]{6}$/i.test(CFG.under || '') ? light(CFG.under) : /^#[0-9a-f]{6}$/i.test(color) ? (parseInt(color.slice(1, 3), 16) * 299 + parseInt(color.slice(3, 5), 16) * 587 + parseInt(color.slice(5, 7), 16) * 114) / 1000 : 0;
    const bright = light(CFG.bg);
    const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    let frame = null, time = CFG.startAt || (still ? 4 : 0), last = 0, raf = 0, timer = 0, size = '';
    let playing = false, seen = true, want = CFG.autoplay !== false && !still, drew = false;
    // 랜딩페이지용: 실제 마우스·스크롤에 반응합니다 (CONFIG.live). true = 페이지에 붙여 쓸 때, 'try' = 미리보기 창(마우스가 없으면 연출대로)
    const LIVE = CFG.live === true || CFG.live === 'try', TRY = CFG.live === 'try';
    const live = { x: 0, y: 0, tx: 0, ty: 0, over: 0, on: false, down: 0, press: false, s: 0, ts: 0, ready: false };
  
    const api = {
      root: root,
      bg: CFG.bg,
      clear: CFG.bg === 'transparent',              // 투명 배경으로 그리는 중 (영상 편집기에 얹을 자막 등). 이때는 화면 전체를 칠하는 바탕을 그리지 않습니다
      fg: bright > 150 ? COLORS[7] : COLORS[0],     // 배경 위에 바로 쓰는 글자색
      ink: COLORS[7],                               // 흰 판 위에 쓰는 글자색
      colors: COLORS.slice(),                       // 색 8개 그대로 (배경 모션이 그라데이션 재료로 씀)
      accent: COLORS[5],                            // 포인트 색
      deep: COLORS[6],                              // 둘째 포인트 색
      on: color => light(color) > 150 ? COLORS[7] : '#ffffff',   // 그 색 위에 올릴 글자색 (밝은 색 위엔 진한 글자, 진한 색 위엔 흰 글자)
      tone: i => COLORS[1 + (i % 5 + 5) % 5],       // i번째 변주 색 (연한 색 ~ 포인트 색)
      rand: rand,
      font: FONT,
      ko: text => /[\u3131-\u318e\uac00-\ud7a3]/.test(text),   // 한글이 들어 있나 (한글이 든 글줄은 한글 글꼴 하나로 씁니다)
      count: NIMG,                                  // 넣은 이미지 칸 수 (0이면 샘플)
      words: CFG.words || [],                       // 넣은 낱말 (글자 모션에서 사용, 비면 기본 낱말)
      live: LIVE && !TRY,                           // 실제 페이지에서 마우스·스크롤에 반응하는 중 (미리보기 칸·영상 저장 때는 false)
      // 발표(모션 PPT)에서 '다음 효과'를 누른 단계 { step, at }: 발표기가 채워 줌. 없으면 null (미리보기·영상은 시간표대로)
      cue: CFG.cue || null,
      page: CFG.page || 0,                          // 모션 PPT에서 몇 번째 장인지 (발표기가 채워 줌, 없으면 0)
      // 마우스 자리 { x, y: 무대 안의 px, down: 누름 0~1, on: 마우스가 와 있는 정도 0~1, fake: 연출용 가짜 커서를 보일 정도 0~1 }
      // demo: 미리보기·영상 저장 때 쓸 연출 자리 { x, y, down, on } (t로 계산해서 넘김). 실제 페이지에서는 진짜 마우스를 따라갑니다
      pointer(demo) {
        const d = Object.assign({ x: api.W / 2, y: api.H / 2, down: 0, on: 1 }, demo || {});
        if (!LIVE) return { x: d.x, y: d.y, down: d.down, on: d.on, fake: 1 };
        if (!live.ready) return TRY ? { x: d.x, y: d.y, down: d.down, on: d.on, fake: 1 } : { x: d.x, y: d.y, down: 0, on: 0, fake: 0 };
        const k = TRY ? live.over : 1, mix = (a, b) => a + (b - a) * k;
        return { x: mix(d.x, live.x), y: mix(d.y, live.y), down: mix(d.down, live.down), on: TRY ? mix(d.on, live.over) : live.over, fake: 1 - k };
      },
      // 스크롤 진행 0~1. 미리보기·영상 저장 때는 demo(t로 계산한 값), 실제 페이지에서는 이 상자(또는 CONFIG.track의 칸)가 화면을 지나는 정도
      scroll: demo => LIVE && !TRY ? live.s : demo,
      image: i => { used.add(i); if (!NIMG) return null; const u = IMGS[i % NIMG]; if (u) return u; const a = api.art(i, true); return a ? a.url : null; },   // i번째 이미지 주소 (없으면 null, 빈 칸이면 샘플 그림)
      // i번째 샘플 그림 { cv, url }. 코드에 qmArt가 함께 들어 있을 때만 나옵니다 (plain: 글자 없는 그림만)
      art: (i, plain) => { drew = true; usedArt.add(i); return typeof qmArt === 'function' ? qmArt(plain ? i : i + shift, plain) : null; },
      // i번째 그림을 CSS background 값으로: 내 이미지가 있으면 이미지, 없으면 샘플 그림
      paint: i => {
        used.add(i);
        const u = NIMG ? IMGS[i % NIMG] : null, a = u ? null : api.art(i, NIMG > 0);   // 내 사진 사이의 빈 칸은 글자 없는 샘플 사진으로
        return u ? `url("${u}") center / cover no-repeat, #1c1c1e` : a ? `url(${a.url}) center / cover no-repeat` : `linear-gradient(145deg, ${COLORS[2]}, ${COLORS[5]})`;
      },
      // 숏폼 자막용 미리보기 바탕: 영상 대신 깔아 두는 흐릿한 장면 (내 이미지를 넣으면 그 그림). 투명 배경일 때는 그리지 않고 null을 돌려줍니다
      footage(dim) {
        if (api.clear) return null;
        used.add(0);
        const el = document.createElement('div'), n = IMGS[0] ? 1 : 0;
        el.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;filter:brightness(' + (dim == null ? 0.85 : dim) + ');background:' + (n ? `url("${IMGS[0]}") center / cover no-repeat` :
          'radial-gradient(55% 32% at 28% 26%, rgba(243,237,226,.5), rgba(243,237,226,0) 70%), radial-gradient(45% 30% at 78% 52%, rgba(154,120,110,.45), rgba(154,120,110,0) 70%), ' +
          'radial-gradient(80% 45% at 50% 108%, rgba(31,52,96,.75), rgba(31,52,96,0) 72%), radial-gradient(40% 25% at 18% 70%, rgba(205,196,184,.28), rgba(205,196,184,0) 70%), linear-gradient(172deg, #4a4f5a, #23262d 60%, #15171c)') + ';';
        root.appendChild(el);
        return el;
      },
      // 0~1 사이 값을 부드럽게 (천천히 출발, 천천히 도착)
      ease: x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); },
      // 0~1 사이 값을 통통 튀게 (살짝 넘쳤다가 제자리로)
      spring: x => { x = Math.max(0, Math.min(1, x)) - 1; return 1 + 2.70158 * x * x * x + 1.70158 * x * x; },
      // 화면 한가운데가 (0,0,0)인 3D 공간. 숫자가 작을수록 원근감이 세집니다
      space(perspective) {
        root.style.perspective = perspective ? perspective + 'px' : 'none';
        return api.group(root, 'left:50%;top:50%;');
      },
      // 여러 조각을 한꺼번에 돌리거나 옮길 묶음
      group(parent, extra) {
        const el = document.createElement('div');
        el.style.cssText = 'position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;' + (extra || '');
        parent.appendChild(el);
        return el;
      },
      // 빈 상자 하나. 상자의 중심이 (0,0)에 놓입니다 (UI 모션에서 사용)
      box(parent, w, h, css) {
        const el = document.createElement('div');
        el.style.cssText = `position:absolute;left:0;top:0;box-sizing:border-box;width:${w}px;height:${h}px;margin:${-h / 2}px 0 0 ${-w / 2}px;font-family:${FONT};` + (css || '');
        parent.appendChild(el);
        return el;
      },
      // 카드 한 장. 카드의 중심이 (0,0)에 놓입니다 (카드 모션에서 사용)
      card(parent, i, w, h, twoSided) {
        const el = api.box(parent, w, h, 'overflow:hidden;'), s = el.style;
        s.borderRadius = Math.min(w, h) * (CFG.radius || 0) + 'px';
        s.backfaceVisibility = s.webkitBackfaceVisibility = twoSided ? 'visible' : 'hidden';
        s.background = api.paint(i);
        return el;
      }
    };
  
    function build() {
      const W = root.clientWidth, H = root.clientHeight;
      if (!W || !H || size === W + 'x' + H) return;
      size = W + 'x' + H;
      if (frame && frame.dispose) frame.dispose();   // WebGL 모션은 다시 만들기 전에 정리
      root.textContent = '';
      api.W = W; api.H = H; api.u = Math.min(W, H);
      if (LIVE && !TRY) { measure(); live.s = live.ts; }
      frame = motion(api);
      frame(time);
      runs(root);
      if (watch) watch.takeRecords();   // 방금 만든 장면은 위에서 다 봤으니 쌓인 기록은 버림
    }
    // 한 글줄 안에 한글과 영문·숫자가 섞였는데 영문 전용 글꼴(Anton·Inter 등)이 앞에 서 있으면,
    // 그 글줄은 글꼴 목록 뒤쪽의 한글 글꼴로 통째로 씁니다 (영문 글꼴과 한글 글꼴이 한 줄에서 따로 놀지 않게)
    const LATIN = /^(Anton|Archivo|Instrument Serif|Inter|JetBrains Mono)$/i;
    function runs(top) {
      const walk = document.createTreeWalker(top, NodeFilter.SHOW_TEXT), seen = new Set();
      for (let n = walk.nextNode(); n; n = walk.nextNode()) if (n.parentElement) seen.add(n.parentElement);
      seen.forEach(el => {
        let own = '';
        el.childNodes.forEach(c => { if (c.nodeType === 3) own += c.nodeValue; });
        if (!/[\u3131-\u318e\uac00-\ud7a3]/.test(own) || !/[A-Za-z0-9]/.test(own)) return;
        const list = getComputedStyle(el).fontFamily.split(',').map(f => f.trim().replace(/^["']|["']$/g, ''));
        if (!LATIN.test(list[0])) return;
        el.style.fontFamily = list.filter(f => !LATIN.test(f)).map(f => /^[a-z-]+$/.test(f) ? f : '"' + f + '"').join(',');
      });
    }
    // 장면이 글자를 바꾸면 바뀐 곳만 다시 봅니다
    const watch = window.MutationObserver ? new MutationObserver(list => mend(list)) : null;
    const mend = list => list.forEach(r => { const el = r.target.nodeType === 3 ? r.target.parentElement : r.target; if (el && root.contains(el)) runs(el); });
    if (watch) watch.observe(root, { childList: true, characterData: true, subtree: true });
    function tick(now) {
      raf = requestAnimationFrame(tick);
      const dt = Math.max(0, Math.min((now - last) / 1000, 0.1));
      time += dt * CFG.speed;                       // 흐른 시간만큼 (뒤로 가지 않게)
      if (CFG.once && time > CFG.once) time = CFG.once;   // 한 번만: 화면에 들어오면 한 번 재생하고 이 초의 장면에서 멈춤
      last = now;
      if (LIVE) follow(dt);
      if (frame) frame(time);
    }
    // 스크롤 진행: CONFIG.track이 있으면 그 칸(키 큰 칸 안에 이 상자를 position:sticky로 넣은 경우)을 다 내려가는 정도, 없으면 이 상자가 화면 아래에서 위로 지나가는 정도
    function measure() {
      const el = CFG.track ? document.querySelector(CFG.track) : root;
      if (!el) return;
      const r = el.getBoundingClientRect(), vh = window.innerHeight || 1;
      live.ts = Math.max(0, Math.min(1, CFG.track ? -r.top / Math.max(1, r.height - vh) : (vh - r.top) / (vh + r.height)));
    }
    // 진짜 마우스·스크롤 값을 부드럽게 따라감
    function follow(dt) {
      const k = 1 - Math.exp(-dt * 14);
      live.x += (live.tx - live.x) * k;
      live.y += (live.ty - live.y) * k;
      live.over += ((live.on ? 1 : 0) - live.over) * (1 - Math.exp(-dt * 6));
      live.down += ((live.press ? 1 : 0) - live.down) * (1 - Math.exp(-dt * 18));
      if (!TRY) { measure(); live.s += (live.ts - live.s) * (1 - Math.exp(-dt * 10)); }
    }
    const spot = e => {
      const r = root.getBoundingClientRect();
      live.tx = (e.clientX - r.left) * root.clientWidth / (r.width || 1);
      live.ty = (e.clientY - r.top) * root.clientHeight / (r.height || 1);
      if (!live.ready) { live.x = live.tx; live.y = live.ty; live.ready = true; }
    };
    // 멈춰 있을 때(일시 정지·동작 줄이기 설정)도 마우스에는 바로 반응
    const poke = () => { if (playing || !frame) return; live.x = live.tx; live.y = live.ty; live.over = live.on ? 1 : 0; live.down = live.press ? 1 : 0; frame(time); };
    const hands = {
      pointerenter: e => { spot(e); live.on = true; poke(); },
      pointermove: e => { spot(e); live.on = true; poke(); },
      pointerleave: () => { live.on = false; live.press = false; poke(); },
      pointerdown: e => { spot(e); live.on = live.press = true; poke(); },
      pointerup: () => { live.press = false; poke(); }
    };
    if (LIVE) Object.keys(hands).forEach(k => root.addEventListener(k, hands[k]));
    // 화면에 보일 때만 움직입니다
    function sync() {
      const on = want && seen;
      if (on && !playing) { playing = true; last = performance.now(); raf = requestAnimationFrame(tick); }
      if (!on && playing) { playing = false; cancelAnimationFrame(raf); }
    }
  
    Object.assign(root.style, { position: 'relative', overflow: 'hidden', background: CFG.bg, aspectRatio: CFG.ratio });
    build();
    const ro = new ResizeObserver(() => { clearTimeout(timer); timer = setTimeout(build, 100); });
    const io = new IntersectionObserver(e => { seen = e[e.length - 1].isIntersecting; sync(); });
    // 웹폰트로 그리는 모션은 폰트가 도착하면 크기를 다시 재서 그립니다
    const refit = () => { if (frame && (frame.fonts || drew)) { size = ''; build(); } };
    if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', refit);
    ro.observe(root);
    io.observe(root);
    sync();
  
    return {
      play() { want = true; sync(); },
      pause() { want = false; sync(); },
      restart() { time = 0; if (frame) frame(time); },
      seek(t) { time = t; if (frame) frame(time); if (watch) mend(watch.takeRecords()); },   // t초의 장면으로 건너뜀 (영상으로 한 장씩 찍을 때)
      now() { return time; },                       // 지금 몇 초의 장면인지 (발표기에서 씀)
      motion() { return frame; },                   // 모션이 돌려준 장면 함수 (frame.steps 같은 정보를 읽을 때)
      slots() { return used.size || usedArt.size; },   // 이 장면이 쓰는 그림 칸 수 (사이트의 '내 사진' 칸)
      destroy() { want = false; sync(); if (LIVE) Object.keys(hands).forEach(k => root.removeEventListener(k, hands[k])); ro.disconnect(); io.disconnect(); if (watch) watch.disconnect(); clearTimeout(timer); if (document.fonts && document.fonts.removeEventListener) document.fonts.removeEventListener('loadingdone', refit); if (frame && frame.dispose) frame.dispose(); root.textContent = ''; }
    };
  }

  qmEngine(document.getElementById('qm-brc-fly-through'), CONFIG, br2Fly);
})();
</script>
</body>
